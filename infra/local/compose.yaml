name: sunset-pulse-local

services:
  mongo:
    image: mongo:7.0
    profiles: [dev]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  mongo-test:
    image: mongo:7.0
    profiles: [acceptance]
    ports:
      - "127.0.0.1::27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 768m

  scheduler-test:
    image: postgres:17-alpine
    profiles: [acceptance]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: scheduler_acceptance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, scheduler_acceptance]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  wikipedia-crawler:
    build:
      context: ../../apps/pulse
      dockerfile: Dockerfile.wikipedia-crawler
    profiles: [wikipedia]
    restart: unless-stopped
    env_file:
      - path: ../../apps/pulse/.env.local
        required: false
      - path: ../../.env
        required: false
    environment:
      NODE_ENV: production
      WIKIPEDIA_STORAGE_ROOT: /var/lib/sunsetpulse/wikipedia
      WIKIPEDIA_TAH_OUTPUT_DIR: /var/lib/sunsetpulse/wikipedia/cartridges
      WIKIPEDIA_INGESTION_STATE_PATH: /var/lib/sunsetpulse/wikipedia/ingestion-state.json
      WIKIPEDIA_DEMAND_PATH: /var/lib/sunsetpulse/wikipedia/demand-queue.json
      WIKIPEDIA_LANGUAGE: ${WIKIPEDIA_LANGUAGE:-en}
      WIKIPEDIA_BATCH_SIZE: ${WIKIPEDIA_BATCH_SIZE:-10}
      WIKIPEDIA_REQUEST_DELAY_MS: ${WIKIPEDIA_REQUEST_DELAY_MS:-1000}
      LEAD_INTEL_PYTHON: /opt/venv/bin/python
      LEAD_INTEL_ALLOWED_DOMAINS: wikipedia.org
    volumes:
      - wikipedia-data:/var/lib/sunsetpulse/wikipedia
    healthcheck:
      test: [CMD, node, -e, "require('fs').accessSync('/var/lib/sunsetpulse/wikipedia')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  wikipedia-data:
