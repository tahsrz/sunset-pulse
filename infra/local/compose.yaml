name: sunset-pulse-local

services:
  mongo:
    image: mongo:7.0
    profiles: [dev]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  mongo-test:
    image: mongo:7.0
    profiles: [acceptance]
    ports:
      - "127.0.0.1::27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 768m

  scheduler-test:
    image: postgres:17-alpine
    profiles: [acceptance]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: scheduler_acceptance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, scheduler_acceptance]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 512m

volumes:
  mongo-data:
