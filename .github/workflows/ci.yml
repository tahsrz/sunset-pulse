name: CI - Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Pulse Lint
        run: npm run lint --workspace=apps/pulse

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Audit Production Dependencies
        run: npm run security:audit:prod

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Enforce Commercial Inventory Truth
        run: npm run test:inventory-truth

  scheduler-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start Supabase for database tests
        working-directory: apps/pulse
        run: supabase start --ignore-health-check --exclude analytics,edge-runtime,functions,imgproxy,inbucket,kong,meta,realtime,rest,storage,studio,vector

      - name: Run PostgreSQL acceptance tests
        working-directory: apps/pulse
        run: npm run test:db

      - name: Stop Supabase
        if: ${{ always() && steps.setup-supabase-cli.outcome == 'success' }}
        working-directory: apps/pulse
        run: supabase stop --no-backup

  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run isolated scheduler and Mongo acceptance
        run: npm run docker:test

  storage-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Verify project storage admission against the real Storage API
        run: |
          export PULSE_TEST_SUPABASE_CLI="$(command -v supabase)"
          npm run test:storage-budget --workspace=apps/pulse

  jamie-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_MOCK_MODE: 'true'
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_build_only
      GROQ_API_KEY: groq-ci-build-only

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Public Site E2E
        run: npm run test:e2e --workspace=apps/pulse -- tests/jamie-public-guide.spec.ts tests/homepage-responsive.spec.ts --reporter=line

      - name: Upload homepage viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-responsive-screenshots
          path: apps/pulse/test-results/homepage-*.png
          if-no-files-found: ignore
